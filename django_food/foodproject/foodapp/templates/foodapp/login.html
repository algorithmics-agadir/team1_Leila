<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - FoodFlex Maroc</title>
    
    {% load static %}
    
    <script src="{% static 'foodapp/js/gsap.min.js' %}"></script>
    <script src="{% static 'foodapp/js/three.min.js' %}"></script>
    <script src="{% static 'foodapp/js/OrbitControls.js' %}"></script>
    
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #2ed573;
            --dark: #2f3542;
            --light: #f1f2f6;
            --font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: var(--dark);
            color: var(--light);
            font-family: var(--font);
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .auth-container {
            background-color: rgba(47, 53, 66, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .auth-header h2 {
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .auth-header p {
            color: #a4b0be;
            font-size: 16px;
        }
        
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .form-group {
            position: relative;
        }
        
        .form-group label {
            position: absolute;
            top: -10px;
            left: 15px;
            background-color: rgba(47, 53, 66, 0.8);
            padding: 0 8px;
            font-size: 12px;
            color: #a4b0be;
            transition: all 0.3s ease;
        }
        
        .form-control {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--light);
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background-color: rgba(255, 255, 255, 0.12);
        }
        
        .form-control:focus + label {
            color: var(--primary);
        }
        
        .btn {
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .btn-primary:active {
            transform: translateY(-1px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }
        
        .form-check {
            display: flex;
            align-items: center;
        }
        
        .form-check-input {
            margin-right: 10px;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }
        
        .form-check-label {
            cursor: pointer;
            color: #a4b0be;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 30px;
            color: #a4b0be;
        }
        
        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .auth-footer a:hover {
            color: var(--secondary);
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: white;
            display: none;
        }
        
        .alert-danger {
            background-color: rgba(231, 76, 60, 0.7);
            border: 1px solid rgba(231, 76, 60, 0.9);
        }
        
        .mb-3 {
            margin-bottom: 15px;
        }
        
        @media (max-width: 480px) {
            .auth-container {
                padding: 30px 20px;
                width: 95%;
            }
        }
        
        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #a4b0be;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            color: var(--light);
        }
        
        .back-link i {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="auth-container">
        <div class="auth-header">
            <h2>Connexion</h2>
            <p>Connectez-vous pour découvrir la cuisine marocaine</p>
        </div>
        
        <div class="alert alert-danger" id="error-message"></div>
        
        <div class="auth-form">
            <div class="form-group">
                <input type="text" id="username" name="username" class="form-control" required />
                <label for="username">Nom d'utilisateur</label>
            </div>
            
            <div class="form-group mb-3">
                <input type="password" id="password" name="password" class="form-control" required />
                <label for="password">Mot de passe</label>
            </div>
            
            <div class="form-check mb-3">
                <input type="checkbox" id="remember" name="remember" class="form-check-input" />
                <label for="remember" class="form-check-label">Se souvenir de moi</label>
            </div>
            
            <button type="button" id="login-button" class="btn btn-primary">Se connecter</button>
        </div>
        
        <div class="auth-footer">
            <p>Vous n'avez pas de compte ? <a href="{% url 'signup' %}">S'inscrire</a></p>
        </div>
        
        <a href="{% url 'index' %}" class="back-link">
            <i>←</i> Retour à l'accueil
        </a>
    </div>
    
    <script>
        {% verbatim %}
        // Configuration Three.js
        let scene, camera, renderer;
        let controls;
        let foods = [];
        const foodModels = [
            { geometry: 'sphere', color: 0xf39c12, scale: 1, name: 'Orange' },
            { geometry: 'sphere', color: 0xe74c3c, scale: 0.8, name: 'Tomate' },
            { geometry: 'cylinder', color: 0x2ecc71, scale: [0.5, 0.5, 2], name: 'Concombre' },
            { geometry: 'torus', color: 0xecf0f1, scale: 1, name: 'Pain' },
            { geometry: 'cone', color: 0xf1c40f, scale: 1, name: 'Tajine' },
            { geometry: 'box', color: 0x8e44ad, scale: [1, 0.5, 1], name: 'Gâteau' }
        ];
        
        // Initialisation de Three.js
        function init() {
            // Créer la scène
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2f3542);
            
            // Créer la caméra
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 25;
            
            // Créer le renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // Ajouter des lumières
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(0, 10, 10);
            scene.add(directionalLight);
            
            // Ajouter des contrôles
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;
            controls.enableZoom = false;
            
            // Créer des objets flottants pour la nourriture
            createFoodObjects();
            
            // Gestionnaire de redimensionnement de fenêtre
            window.addEventListener('resize', onWindowResize, false);
            
            // Démarrer l'animation
            animate();
        }
        
        // Créer des objets alimentaires
        function createFoodObjects() {
            for (let i = 0; i < 20; i++) {
                const randomFood = foodModels[Math.floor(Math.random() * foodModels.length)];
                let geometry;
                
                // Créer une géométrie en fonction du type
                switch (randomFood.geometry) {
                    case 'sphere':
                        geometry = new THREE.SphereGeometry(1, 32, 32);
                        break;
                    case 'box':
                        geometry = new THREE.BoxGeometry(1, 1, 1);
                        break;
                    case 'cylinder':
                        geometry = new THREE.CylinderGeometry(0.5, 0.5, 2, 32);
                        break;
                    case 'cone':
                        geometry = new THREE.ConeGeometry(1, 2, 32);
                        break;
                    case 'torus':
                        geometry = new THREE.TorusGeometry(0.7, 0.3, 16, 32);
                        break;
                    default:
                        geometry = new THREE.SphereGeometry(1, 32, 32);
                }
                
                // Matériau avec phong shading pour un aspect plus réaliste
                const material = new THREE.MeshPhongMaterial({
                    color: randomFood.color,
                    shininess: 50,
                    specular: 0x666666
                });
                
                const food = new THREE.Mesh(geometry, material);
                
                // Position aléatoire
                food.position.x = Math.random() * 40 - 20;
                food.position.y = Math.random() * 40 - 20;
                food.position.z = Math.random() * 40 - 20;
                
                // Taille aléatoire
                const scale = 0.5 + Math.random() * 1.5;
                if (Array.isArray(randomFood.scale)) {
                    food.scale.set(
                        randomFood.scale[0] * scale,
                        randomFood.scale[1] * scale,
                        randomFood.scale[2] * scale
                    );
                } else {
                    food.scale.set(randomFood.scale * scale, randomFood.scale * scale, randomFood.scale * scale);
                }
                
                // Rotation aléatoire
                food.rotation.x = Math.random() * Math.PI * 2;
                food.rotation.y = Math.random() * Math.PI * 2;
                food.rotation.z = Math.random() * Math.PI * 2;
                
                // Animation personnalisée
                food.userData = {
                    rotationSpeed: {
                        x: Math.random() * 0.01 - 0.005,
                        y: Math.random() * 0.01 - 0.005,
                        z: Math.random() * 0.01 - 0.005
                    },
                    floatSpeed: 0.001 + Math.random() * 0.003,
                    floatHeight: 0.5 + Math.random() * 0.5,
                    floatOffset: Math.random() * Math.PI * 2
                };
                
                scene.add(food);
                foods.push(food);
            }
        }
        
        // Animation
        function animate() {
            requestAnimationFrame(animate);
            
            // Animer les objets alimentaires
            const time = Date.now() * 0.001;
            foods.forEach((food, i) => {
                // Rotation continue
                food.rotation.x += food.userData.rotationSpeed.x;
                food.rotation.y += food.userData.rotationSpeed.y;
                food.rotation.z += food.userData.rotationSpeed.z;
                
                // Flottement oscillant
                food.position.y += Math.sin(time + food.userData.floatOffset) * food.userData.floatSpeed * food.userData.floatHeight;
            });
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        // Gestionnaire de redimensionnement
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Initialiser Three.js au chargement de la page
        window.addEventListener('DOMContentLoaded', init);
        {% endverbatim %}
        
        // Gestionnaire d'événements pour le formulaire de connexion
        document.addEventListener('DOMContentLoaded', function() {
            const loginButton = document.getElementById('login-button');
            const errorMessage = document.getElementById('error-message');
            
            loginButton.addEventListener('click', function() {
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const remember = document.getElementById('remember').checked;
                
                if (!username || !password) {
                    errorMessage.innerText = 'Veuillez remplir tous les champs.';
                    errorMessage.style.display = 'block';
                    return;
                }
                
                // Obtenir le jeton CSRF (il est automatiquement inclus dans la requête par Django)
                const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || getCookie('csrftoken');
                
                                fetch('/login/', {                    method: 'POST',                    headers: {                        'Content-Type': 'application/json',                        'X-CSRFToken': csrftoken                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        remember: remember
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Si c'est un compte restaurant, rediriger vers son tableau de bord
                        if (data.account_type === 'restaurant' && data.redirect) {
                            window.location.href = data.redirect;
                        } else {
                            // Sinon rediriger vers l'accueil
                            window.location.href = '{% url "index" %}';
                        }
                    } else if (data.errors) {
                        errorMessage.innerText = data.errors.general || 'Erreur lors de la connexion.';
                        errorMessage.style.display = 'block';
                    }
                })
                .catch(error => {
                    console.error('Erreur:', error);
                    errorMessage.innerText = 'Une erreur est survenue. Veuillez réessayer.';
                    errorMessage.style.display = 'block';
                });
            });
            
            // Fonctionnalité pour cacher l'erreur quand l'utilisateur commence à taper
            document.querySelectorAll('.form-control').forEach(function(input) {
                input.addEventListener('input', function() {
                    errorMessage.style.display = 'none';
                });
            });
        });
        
        // Fonction pour récupérer un cookie (pour CSRF)
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
    
    {% csrf_token %}
</body>
</html>
